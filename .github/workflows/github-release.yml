name: GitHub Linux release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-linux-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the release version
    if: github.event.repository.fork && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("expected a release version in Cargo.toml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Check the merged release and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -d "changelog.d/$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            | jq -e --arg branch "release-v$VERSION" --arg sha "$GITHUB_SHA" \
              'any(.[]; .merged_at != null and .base.ref == "main" and .head.ref == $branch and .merge_commit_sha == $sha)'
          bash .github/scripts/verify-release-tag.sh "v$VERSION" "$GITHUB_SHA"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: koan-linux-x86_64
            runner: ubuntu-24.04
          - name: koan-linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.name }}
      - name: Test the terminal UI
        run: cargo test --locked -p koan-tui --lib
      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCHIVE: ${{ matrix.name }}.tar.gz
        run: |
          cargo build --release --locked -p koan-cli
          test "$(target/release/koan --version)" = "koan $VERSION"
          tar czf "$ARCHIVE" -C target/release koan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          retention-days: 30

  publish:
    name: Publish the GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: koan-linux-*
          path: downloads
          merge-multiple: true
      - name: Publish the archives and checksums
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash ../.github/scripts/verify-release-tag.sh "v$VERSION" "$GITHUB_SHA"
          sha256sum koan-linux-*.tar.gz > SHA256SUMS
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' ../CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'NOTES'

          Download the archive for your Linux architecture, extract it, and run `./koan`.
          These binaries require glibc 2.39 or newer, ALSA, and D-Bus.
          Choose `auto` in Settings, Terminal, Theme to follow your terminal's colors in Hyprland.
          NOTES
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,targetCommitish > release-state.json 2> release-error; then
            jq -e --arg sha "$GITHUB_SHA" \
              '.isDraft and .targetCommitish == $sha' release-state.json || {
              echo "::error::v$VERSION is published or targets a different commit"
              exit 1
            }
          elif grep -Fq 'release not found' release-error; then
            gh release create "v$VERSION" --draft \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v$VERSION" --notes-file release-notes.md
          else
            cat release-error >&2
            exit 1
          fi
          gh release upload "v$VERSION" koan-linux-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          bash ../.github/scripts/verify-release-tag.sh "v$VERSION" "$GITHUB_SHA"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest --title "v$VERSION" --notes-file release-notes.md
